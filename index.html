<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de P.A</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 13px 20px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-add {
            background: #2563eb;
            color: white;
        }

        .btn-add:hover {
            background: #1d4ed8;
        }

        .search {
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 7px 12px;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .contador {
            margin-bottom: 15px;
            color: #555;
        }

        .vazio {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            .form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Registro de P.A</h1>
    <p>Controle de numeração das máquinas</p>
</header>

<div class="container">

    <div class="card">

        <h2>Cadastrar P.A</h2>

        <br>

        <div class="form">
            <input
                type="text"
                id="numeroPA"
                placeholder="Ex: P.A 01 ou P.A 014"
            >

            <button class="btn-add" onclick="adicionarPA()">
                Adicionar
            </button>
        </div>

    </div>

    <div class="card">

        <h2>Registros</h2>

        <br>

        <input
            class="search"
            type="text"
            id="pesquisa"
            placeholder="Pesquisar P.A..."
            onkeyup="mostrarPA()"
        >

        <div class="contador" id="contador"></div>

        <table>

            <thead>
                <tr>
                    <th>Nº</th>
                    <th>P.A</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="listaPA"></tbody>

        </table>

    </div>

</div>

<script>

    let registros = JSON.parse(
        localStorage.getItem("registrosPA")
    ) || [];

    function adicionarPA() {

        const campo = document.getElementById("numeroPA");

        let numero = campo.value.trim();

        if (numero === "") {
            alert("Digite o número do P.A.");
            return;
        }

        // Padroniza para maiúsculo
        numero = numero.toUpperCase();

        // Verifica duplicidade
        const existe = registros.some(
            pa => pa === numero
        );

        if (existe) {
            alert("Esse P.A já está registrado.");
            return;
        }

        registros.push(numero);

        // Ordena os registros
        registros.sort((a, b) =>
            a.localeCompare(b, undefined, {
                numeric: true
            })
        );

        salvar();

        campo.value = "";

        mostrarPA();
    }

    function excluirPA(index) {

        const confirmacao = confirm(
            "Deseja realmente excluir este P.A?"
        );

        if (!confirmacao) {
            return;
        }

        registros.splice(index, 1);

        salvar();

        mostrarPA();
    }

    function salvar() {

        localStorage.setItem(
            "registrosPA",
            JSON.stringify(registros)
        );

    }

    function mostrarPA() {

        const tabela =
            document.getElementById("listaPA");

        const pesquisa =
            document.getElementById("pesquisa")
            .value
            .toUpperCase();

        tabela.innerHTML = "";

        const filtrados = registros.filter(pa =>
            pa.includes(pesquisa)
        );

        document.getElementById("contador").innerText =
            "Total de P.A registrados: " + registros.length;

        if (filtrados.length === 0) {

            tabela.innerHTML = `
                <tr>
                    <td colspan="3" class="vazio">
                        Nenhum P.A encontrado.
                    </td>
                </tr>
            `;

            return;
        }

        filtrados.forEach((pa) => {

            const index = registros.indexOf(pa);

            tabela.innerHTML += `
                <tr>
                    <td>${index + 1}</td>

                    <td>
                        <strong>${pa}</strong>
                    </td>

                    <td>
                        <button
                            class="btn-delete"
                            onclick="excluirPA(${index})"
                        >
                            Excluir
                        </button>
                    </td>
                </tr>
            `;

        });

    }

    // Permitir cadastrar apertando ENTER
    document.getElementById("numeroPA")
        .addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                adicionarPA();
            }

        });

    // Carrega os registros ao abrir
    mostrarPA();

</script>

</body>
</html>
